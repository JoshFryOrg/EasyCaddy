# Core Rule Set settings for the self-hosted apps EasyCaddy fronts: a Docker registry, media servers, file sync and
# upload services. The `selfhosted` WAF profile (EASYCADDY_WAF_PROFILE, the default): waf.caddy includes it after
# coraza.conf and before crs/crs-setup.conf. The CRS keeps any of these variables already set, and sets its defaults for
# the rest. The `strict` profile (strict.conf) leaves all of this out.

# Methods: the CRS allows only GET, HEAD, POST and OPTIONS. Registries push with PUT and PATCH and delete with DELETE;
# Plex, WebDAV-ish file apps and most REST APIs use them too.
SecAction "id:900200,phase:1,pass,t:none,nolog,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# Request body types: the CRS's list, plus raw binary (registry blobs, tus resumable uploads), plain text, and Docker's
# and OCI's manifest types (which coraza.conf parses as JSON).
SecAction "id:900220,phase:1,pass,t:none,nolog,setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |application/octet-stream| |application/offset+octet-stream| |text/plain| |application/vnd.docker.distribution.manifest.v2+json| |application/vnd.docker.distribution.manifest.list.v2+json| |application/vnd.oci.image.manifest.v1+json| |application/vnd.oci.image.index.v1+json|'"

# A raw binary body is left unread, while the method, URI, query and headers are still checked: the rules can't parse
# binary, and reading it as text they'd match random bytes as attacks (a registry layer push would be blocked).
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:offset\+)?octet-stream\s*(?:;|$)" \
     "id:200020,phase:1,pass,t:none,t:lowercase,nolog,ctl:requestBodyAccess=Off"

# Headers: the CRS refuses Expect and Content-Range by policy, but large uploads use both. Clients (curl, .NET,
# rclone) send `Expect: 100-continue` before a big body, and resumable or chunked uploads (tus, registry chunked
# pushes) send Content-Range. The rest of the CRS's list stays refused.
SecAction "id:900250,phase:1,pass,t:none,nolog,setvar:'tx.restricted_headers_basic=/content-encoding/ /proxy/ /lock-token/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/ /x-middleware-subrequest/'"
