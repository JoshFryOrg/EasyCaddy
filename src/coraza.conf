# Coraza engine settings, baked into the image at /usr/share/easycaddy/coraza/coraza.conf. waf.caddy includes it first,
# then sets the engine mode and body limit from the environment, then a profile (selfhosted.conf or strict.conf), then
# the OWASP Core Rule Set. Based on Coraza's coraza.conf-recommended, less what doesn't fit a reverse proxy.

# Request bodies are inspected, the first 1 MiB of each. Past that the rest streams on to the app uninspected
# (ProcessPartial), so a multi-gigabyte upload costs at most 1 MiB of memory while in flight, never its whole size.
# Cap a site's body size with Caddy's `request_body`.
SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyInMemoryLimit 1048576
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction ProcessPartial

# Bodies are parsed by their type, so the rules see JSON and XML fields. JSON includes vendor types such as Docker's
# and OCI's image manifests (application/vnd.oci.image.manifest.v1+json).
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
     "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/(?:[a-z0-9.-]+\+)?json" \
     "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# A body that claims a type and can't be parsed is refused, as it could otherwise carry anything past the rules. Not
# one longer than the inspected 1 MiB: its first MiB alone never parses, and refusing it would refuse every large JSON
# request.
SecRule INBOUND_DATA_ERROR "@eq 0" \
"id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2,chain"
    SecRule REQBODY_ERROR "!@eq 0" "t:none"

# Responses aren't inspected: buffering them would break streams (Plex, SSE, websockets) and hold every download in
# memory. They pass straight through.
SecResponseBodyAccess Off

# No audit log: coraza-caddy logs each matched rule through Caddy's own log, with the request's unique_id.
SecAuditEngine Off

SecTmpDir /tmp
SecArgumentSeparator &
SecCookieFormat 0
