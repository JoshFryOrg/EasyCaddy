name: Publish

on:
    push:
        branches:
            - main
        paths:
            - 'Dockerfile'
            - 'custom-entrypoint.sh'
            - 'go.mod'
            - 'go.sum'
            - '.github/workflows/publish.yml'
    workflow_dispatch:

# Least privilege for the GITHUB_TOKEN: every job only checks out. The registry
# push authenticates with DOCKER_PASSWORD, not the token.
permissions:
    contents: read

jobs:
    docker:
        runs-on: self-hosted

        env:
            DOCKERFILE_PATH: 'Dockerfile'
            DOCKERFILE_CONTEXT: '.'
            DOCKER_IMAGE_NAME: 'easycaddy'
            DOCKER_REGISTRY: 'docker.joshfry.uk'
            DOCKER_USERNAME: 'docker'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Registry
              uses: docker/login-action@v4
              with:
                registry: ${{ env.DOCKER_REGISTRY }}
                username: ${{ env.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker image
              uses: docker/build-push-action@v7
              with:
                file: ${{ env.DOCKERFILE_PATH }}
                context: ${{ env.DOCKERFILE_CONTEXT }}
                push: true
                tags: |
                  ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest

    cleanup:
        runs-on: self-hosted
        needs: [docker]

        steps:
            - name: Prune Build Images
              run: docker image prune --all --force
