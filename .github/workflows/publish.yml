name: Publish

on:
    push:
        branches:
            - main
        # Only the image's inputs and this pipeline itself. Docs, Dependabot config and tools.go (which only
        # exposes the modules to Dependabot; the versions the build uses come from go.mod) don't republish.
        paths:
            - 'Dockerfile'
            - 'custom-entrypoint.sh'
            - 'go.mod'
            - 'go.sum'
            - '.github/workflows/publish.yml'
    workflow_dispatch:

# Least privilege for the GITHUB_TOKEN: the job only checks out. The Docker Hub
# push authenticates with DOCKER_PASSWORD, not the token.
permissions:
    contents: read

jobs:
    docker:
        runs-on: ubuntu-latest

        env:
            DOCKERFILE_PATH: 'Dockerfile'
            DOCKERFILE_CONTEXT: '.'
            DOCKER_IMAGE_NAME: 'easycaddy'
            DOCKER_REGISTRY: 'joshfryup'
            DOCKER_USERNAME: 'joshfryup'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Registry
              uses: docker/login-action@v4
              with:
                username: ${{ env.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker image
              uses: docker/build-push-action@v7
              with:
                file: ${{ env.DOCKERFILE_PATH }}
                context: ${{ env.DOCKERFILE_CONTEXT }}
                push: true
                tags: |
                  ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
